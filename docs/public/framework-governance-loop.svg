<svg width="1400" height="980" viewBox="0 0 1400 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="cycle-arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1.5L10.5 6L1 10.5L3.2 6Z" fill="#111827"/>
    </marker>
  </defs>
  <rect width="1400" height="980" rx="40" fill="#F6F7F5"/>
  <rect x="32" y="32" width="1336" height="916" rx="32" fill="#FFFFFF" stroke="#D9E1D8" stroke-width="2"/>
  <text x="84" y="104" fill="#111827" font-size="44" font-family="IBM Plex Sans, PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">安全与治理控制点闭环图</text>
  <text x="84" y="146" fill="#4B5563" font-size="22" font-family="IBM Plex Sans, PingFang SC, Microsoft YaHei, sans-serif">治理不是单点能力，而是沿请求生命周期分布的连续控制链条。</text>

  <g font-family="IBM Plex Sans, PingFang SC, Microsoft YaHei, sans-serif">
    <circle cx="700" cy="520" r="196" fill="#111827"/>
    <circle cx="700" cy="520" r="156" fill="#1F2937"/>
    <text x="700" y="496" text-anchor="middle" fill="#F9FAFB" font-size="32" font-weight="700">企业智能体请求</text>
    <text x="700" y="540" text-anchor="middle" fill="#CBD5E1" font-size="20">用户进入应用</text>
    <text x="700" y="572" text-anchor="middle" fill="#CBD5E1" font-size="20">检索 / 工具 / 模型调用</text>
    <text x="700" y="604" text-anchor="middle" fill="#CBD5E1" font-size="20">结果回传 / 反馈 / 发布</text>

    <circle cx="700" cy="246" r="106" fill="#DBEAFE"/>
    <text x="700" y="226" text-anchor="middle" fill="#1E3A8A" font-size="22" font-weight="700">1. 身份接入</text>
    <text x="700" y="258" text-anchor="middle" fill="#1F2937" font-size="16">企业 SSO / IAM</text>
    <text x="700" y="284" text-anchor="middle" fill="#475569" font-size="15">APISIX 承接认证接入</text>

    <circle cx="964" cy="364" r="106" fill="#D1FAE5"/>
    <text x="964" y="344" text-anchor="middle" fill="#065F46" font-size="22" font-weight="700">2. 权限裁决</text>
    <text x="964" y="376" text-anchor="middle" fill="#1F2937" font-size="16">Casbin / 组织角色</text>
    <text x="964" y="402" text-anchor="middle" fill="#475569" font-size="14.5">应用、知识、工具粒度控制</text>

    <circle cx="1038" cy="642" r="106" fill="#E0E7FF"/>
    <text x="1038" y="622" text-anchor="middle" fill="#4338CA" font-size="20" font-weight="700">3. 数据分类与标签</text>
    <text x="1038" y="654" text-anchor="middle" fill="#1F2937" font-size="14.5">OpenMetadata / 数据治理</text>
    <text x="1038" y="680" text-anchor="middle" fill="#475569" font-size="14.5">分级、责任人、生命周期</text>

    <circle cx="700" cy="794" r="106" fill="#FEF3C7"/>
    <text x="700" y="774" text-anchor="middle" fill="#B45309" font-size="20" font-weight="700">4. 检索与输出控制</text>
    <text x="700" y="806" text-anchor="middle" fill="#1F2937" font-size="15">权限过滤 / 重排 / Guard</text>
    <text x="700" y="832" text-anchor="middle" fill="#475569" font-size="14.5">检索前过滤，输出前审查</text>

    <circle cx="362" cy="642" r="106" fill="#FCE7F3"/>
    <text x="362" y="622" text-anchor="middle" fill="#BE185D" font-size="22" font-weight="700">5. 审计留痕</text>
    <text x="362" y="654" text-anchor="middle" fill="#1F2937" font-size="15.5">LangFuse / OTel / 日志</text>
    <text x="362" y="680" text-anchor="middle" fill="#475569" font-size="14">用户动作、检索命中、模型调用</text>

    <circle cx="436" cy="364" r="106" fill="#E0F2FE"/>
    <text x="436" y="344" text-anchor="middle" fill="#0369A1" font-size="22" font-weight="700">6. 发布门槛</text>
    <text x="436" y="376" text-anchor="middle" fill="#1F2937" font-size="15.5">评测、灰度、k6 基线</text>
    <text x="436" y="402" text-anchor="middle" fill="#475569" font-size="14.5">先评测再灰度，再正式发布</text>

    <path d="M813 264Q848 270 874 291" stroke="#111827" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cycle-arrow)"/>
    <path d="M1021 463Q1038 493 1038 526" stroke="#111827" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cycle-arrow)"/>
    <path d="M950 714Q887 758 814 775" stroke="#111827" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cycle-arrow)"/>
    <path d="M587 776Q513 758 452 715" stroke="#111827" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cycle-arrow)"/>
    <path d="M362 528Q362 493 378 465" stroke="#111827" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cycle-arrow)"/>
    <path d="M524 292Q552 270 585 264" stroke="#111827" stroke-width="3.5" stroke-linecap="round" marker-end="url(#cycle-arrow)"/>

    <rect x="84" y="876" width="1232" height="46" rx="18" fill="#111827"/>
    <text x="700" y="905" text-anchor="middle" fill="#F9FAFB" font-size="18">治理闭环口径：身份先收敛、权限先裁决、数据先打标签、检索先过滤、输出再审查、全链路持续留痕，并以评测和灰度作为发布门槛。</text>
  </g>
</svg>
